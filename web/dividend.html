<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>红利看板</title><link rel="stylesheet" href="styles.css"><style>.dividend-shell{max-width:1180px;margin:0 auto;padding:28px}.dividend-search{width:100%;padding:14px;border:1px solid #cdd6e3;border-radius:10px;font-size:16px}.dividend-results,.dividend-table,.dividend-detail{background:#fff;border:1px solid #e4e9f0;border-radius:12px;padding:16px;margin-top:14px}.dividend-results button,.dividend-table button{margin-left:8px}.dividend-muted{color:#697586}.dividend-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.dividend-card{border:1px solid #e4e9f0;border-radius:10px;padding:14px}.dividend-card strong{display:block;font-size:22px;margin-top:8px}@media(max-width:700px){.dividend-shell{padding:16px}.dividend-grid{grid-template-columns:1fr}.table-wrap{overflow:auto}}</style></head>
<body><main class="fund-flow-layout"><aside class="strategy-sidebar dashboard-sidebar" aria-label="ETF看板导航"><div class="sidebar-brand"><span class="sidebar-brand-icon" aria-hidden="true">⌁</span><span>投资分析看板</span></div><div class="sidebar-divider"></div><section class="sidebar-section"><button class="sidebar-section-toggle" type="button" data-sidebar-toggle="rotation-items" aria-expanded="true"><span class="sidebar-chevron" aria-hidden="true">⌄</span><span>轮动看板</span></button><div id="rotation-items" class="sidebar-section-items"><a class="strategy-item" href="/web/?strategy=dividend-growth">300红利 / 300成长（ETF）</a><a class="strategy-item" href="/web/?strategy=prism">成长100R / 价值100R</a><a class="strategy-item" href="/web/?strategy=dividend-hs300">300红利 / 沪深300</a><a class="strategy-item" href="/web/?strategy=growth-value-300">300成长 / 300价值</a><a class="strategy-item" href="/web/?strategy=csi2000-hs300">中证2000 / 沪深300</a><a class="strategy-item" href="/web/?strategy=nonferrous-chemical">中证有色 / 中证化工</a><a class="strategy-item" href="/web/?strategy=banks-exbank-financial">中证银行 / 非银金融</a><a class="strategy-item" href="/web/?strategy=dividend-growth-300">300红利 / 300成长（指数）</a><a class="strategy-item" href="/web/?strategy=dividend-a-share">中证红利 / 中证A股</a></div></section><div class="sidebar-divider"></div><section class="sidebar-section"><button class="sidebar-section-toggle" type="button" data-sidebar-toggle="dividend-items" aria-expanded="true"><span class="sidebar-chevron" aria-hidden="true">⌄</span><span>红利看板</span></button><div id="dividend-items" class="sidebar-section-items"><a class="strategy-item dividend-entry" data-type="ETF" href="/web/dividend.html?type=ETF">ETF股息率</a><a class="strategy-item dividend-entry" data-type="STOCK" href="/web/dividend.html?type=STOCK">股票股息率</a></div></section><div class="sidebar-divider"></div><a class="sidebar-standalone fund-flow-link" href="/web/fund-flow.html"><span class="sidebar-nav-icon" aria-hidden="true">♜</span><span>沪深300 ETF资金流向</span></a><p class="sidebar-note">选择看板后，基准日期和图表会随之切换。</p></aside><div class="dividend-main"><div class="dividend-shell"><p class="eyebrow">投资分析看板 · 红利看板</p><h1 id="title">红利看板</h1><p class="subline">现金分派收益率；缺少完整证据时显示不可用，不以零替代。</p><input id="search" class="dividend-search" aria-label="搜索证券" placeholder="输入代码、名称或简称搜索……"><div id="results" class="dividend-results hidden"></div><section class="dividend-table"><h2 id="watch-title">我的自选</h2><button id="sort-ttm">按TTM排序</button><button id="refresh">刷新自选</button><div id="watchlist" class="dividend-muted">加载中……</div></section><section class="dividend-table"><h2>未来90天除息时间线</h2><div id="calendar" class="dividend-muted">只显示已确认日期；预案日期不虚构。</div></section><section id="detail" class="dividend-detail hidden"></section></div></div></main><script src="dividend.js?v=20261101-2"></script><script>const t=new URLSearchParams(location.search).get('type')==='STOCK'?'STOCK':'ETF';document.querySelectorAll('.dividend-entry').forEach(a=>a.classList.toggle('active',a.dataset.type===t));document.querySelectorAll('[data-sidebar-toggle]').forEach(b=>b.addEventListener('click',()=>{const p=document.getElementById(b.dataset.sidebarToggle),open=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',String(!open));b.querySelector('.sidebar-chevron').textContent=open?'›':'⌄';p.hidden=open;}));</script></body></html>
