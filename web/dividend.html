<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>红利看板</title>
  <link rel="stylesheet" href="theme.css?v=20261101-2">
  <link rel="stylesheet" href="ui-components.css?v=20261109-ui3">
  <link rel="stylesheet" href="dividend.css?v=20261109-ui4">
</head>
<body>
  <main class="dashboard-layout">
    <aside data-dashboard-navigation data-active-section="dividend"></aside>
    <div class="dashboard-content dividend-main">
      <div class="dividend-shell">
        <header class="page-hero">
          <div class="page-heading">
            <p class="eyebrow">投资分析看板 · 红利看板</p>
            <h1 id="title">红利看板</h1>
            <p class="subline">提供方股息率与实际现金派息 TTM 分列展示；缺失数据说明原因。</p>
          </div>
        </header>
        <label class="ui-field" for="search">
          <span>搜索证券</span>
          <input id="search" class="ui-input dividend-search" placeholder="输入代码、名称或简称搜索……" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="results" autocomplete="off">
        </label>
        <div id="results" class="dividend-results hidden" role="listbox" aria-label="证券搜索结果"></div>
        <p id="dividend-action-status" class="dividend-action-status hidden" role="status" aria-live="polite"></p>
        <section class="dividend-table">
          <div class="ui-panel-heading">
            <h2 id="watch-title">我的自选</h2>
            <div>
              <button id="sort-ttm" class="ui-button" type="button">按代码降序</button>
              <button id="refresh" class="ui-button ui-button--primary" type="button">刷新自选</button>
            </div>
          </div>
          <div id="watchlist" class="dividend-muted">加载中……</div>
          <p id="refresh-status" class="dividend-muted" role="status"></p>
        </section>
        <section id="etfirst-yield-section" class="dividend-table hidden">
          <div class="ui-panel-heading">
            <h2>南方 ETFirst · ETF 跟踪指数股息率</h2>
            <button id="etfirst-reload" class="ui-button" type="button">重新获取</button>
          </div>
          <p class="dividend-muted">此处是跟踪指数的股息率，不是 ETF 实际现金派息率，也不是持仓加权股息率。</p>
          <div id="etfirst-yield-list" class="dividend-muted">加载中……</div>
          <div class="dividend-list-pager">
            <button id="etfirst-prev" class="ui-button" type="button">上一页</button>
            <span id="etfirst-page-status" class="dividend-muted"></span>
            <button id="etfirst-next" class="ui-button" type="button">下一页</button>
          </div>
        </section>
        <section class="dividend-table">
          <h2>未来90天除息时间线</h2>
          <div id="calendar" class="dividend-muted">只显示已确认日期；预案日期不虚构。</div>
        </section>
        <section id="detail" class="dividend-detail hidden"></section>
      </div>
    </div>
  </main>
  <script src="navigation.js?v=20261109-ui3"></script>
  <script src="dividend.js?v=20261109-ui4"></script>
  <script src="dividend-history.js?v=20261109-history1"></script>
</body>
</html>
