<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A股ETF看板</title>
  <link rel="stylesheet" href="theme.css?v=20261101-2">
  <link rel="stylesheet" href="ui-components.css?v=20261101-2">
  <link rel="stylesheet" href="styles.css?v=20261102-1">
  <script>
    window.MathJax = { tex: { inlineMath: [["\\(", "\\)"]], displayMath: [["\\[", "\\]"]] }, svg: { fontCache: "global" } };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <script src="echarts.min.js"></script>
  <script src="chart-theme.js?v=20261101"></script>
</head>
<body>
  <main class="dashboard-layout shell app-layout">
    <aside data-dashboard-navigation data-active-section="rotation"></aside>
    <div class="dashboard-content content-column">
    <header class="page-hero hero">
      <div class="page-heading">
        <p class="eyebrow">ETFirst · ETF MARKET DASHBOARD</p>
      <h1 id="page-title">300红利与300成长轮动</h1>
        <p id="page-subline" class="subline">以选定交易日收盘价为基准，比较红利、成长与沪深300 ETF 的表现。</p>
        <p id="strategy-universe" class="strategy-universe"></p>
      </div>
      <div class="control-panel ui-toolbar">
        <label for="benchmark-date">基准日期</label>
        <input id="benchmark-date" type="date" value="2025-12-31">
        <span id="benchmark-status" class="hint">实际基准交易日：加载中</span>
        <button id="refresh-data" class="button ui-button ui-button--primary refresh-button">刷新全部数据</button>
        <button id="strategy-guide-button" class="button ui-button guide-button">策略说明</button>
      </div>
    </header>

    <section id="message" class="message hidden"></section>
    <section id="kpis" class="kpis"></section>

    <section class="panel chart-panel">
      <div class="panel-heading">
        <div>
          <h2>累计涨幅与红利−成长差值</h2>
          <p id="freshness">数据加载中</p>
        </div>
        <button id="download-csv" class="button">下载 CSV</button>
      </div>
      <div id="main-chart" class="chart"></div>
    </section>

    <section id="main-data-panel" class="panel data-table-panel">
      <div class="panel-heading"><div><h2>交易日数据</h2><p>数值随基准日期动态重算。</p></div><button id="toggle-main-table" class="button" type="button" aria-expanded="false" aria-controls="main-table-region">展开交易日数据</button></div>
      <div id="main-table-region" class="table-wrap" hidden><table id="data-table"><thead></thead><tbody></tbody></table></div>
    </section>
    <section id="prism-content" class="hidden">
      <div id="prism-time-toolbar" class="prism-time-toolbar" aria-label="三棱镜时间范围与历史截面控制">
        <div class="prism-range-group" role="group" aria-label="时间范围">
          <button type="button" class="prism-range-button" data-prism-range="6m">6M</button>
          <button type="button" class="prism-range-button" data-prism-range="1y">1Y</button>
          <button type="button" class="prism-range-button" data-prism-range="3y">3Y</button>
          <button type="button" class="prism-range-button" data-prism-range="5y">5Y</button>
          <button type="button" class="prism-range-button active" data-prism-range="all">全部</button>
        </div>
        <div class="prism-time-state"><span id="prism-view-range">显示区间：全部</span><span id="prism-selected-date">当前观察日：最新交易日 · 未锁定</span><button id="prism-unlock" type="button" class="prism-unlock hidden">已锁定 · 点击解锁</button></div>
      </div>
      <div id="prism-snapshot" class="prism-snapshot" aria-live="polite"></div>
      <section class="panel chart-panel"><div class="panel-heading"><div><h2 id="prism-main-title">同一基准下的成长100R与价值100R累计收益</h2><p id="prism-freshness">数据加载中</p></div><button id="download-prism-csv" class="button">下载 CSV</button></div><div id="prism-main-chart" class="chart"></div></section>
      <section class="panel"><h2 id="prism-ratio-title">成长100R / 价值100R 比值及242日布林线</h2><div id="prism-ratio-chart" class="chart"></div></section>
      <section class="panel"><h2 id="prism-spread-title">40日收益差及242日均线</h2><div id="prism-spread-chart" class="chart"></div></section>
      <section class="panel"><h2 id="prism-rsi-title">比值14日 RSI 及242日均线</h2><div id="prism-rsi-chart" class="chart"></div></section>
      <section id="prism-data-panel" class="panel data-table-panel"><div class="panel-heading"><div><h2>三棱镜交易日数据</h2><p>原始指数点位计算，不对指数分别归一化。</p></div><button id="toggle-prism-table" class="button" type="button" aria-expanded="false" aria-controls="prism-table-region">展开交易日数据</button></div><div id="prism-table-region" class="table-wrap" hidden><table id="prism-table"><thead></thead><tbody></tbody></table></div></section>
    </section>
    </div>
  </main>
  <section id="strategy-guide-modal" class="guide-modal hidden" role="dialog" aria-modal="true" aria-labelledby="strategy-guide-title">
    <div class="guide-backdrop" data-guide-close="true"></div>
    <div class="guide-dialog" role="document">
      <div class="guide-dialog-header">
        <h2 id="strategy-guide-title">策略说明</h2>
        <button id="strategy-guide-close" class="guide-close" type="button" aria-label="关闭策略说明">×</button>
      </div>
      <div id="strategy-guide-content" class="guide-content"></div>
    </div>
  </section>
  <script src="navigation.js?v=20261101-2"></script>
  <script src="app.js?v=20261101-11"></script>
</body>
</html>
